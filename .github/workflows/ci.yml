name: Tabayyun CI - Integrity Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Scientific & Technical Integrity Check
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tabayyun_ci?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies (Strict Lockfile)
        run: npm ci

      - name: Validate Scientific Content (Zod + YAML)
        run: npm run validate-content

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Test Methodological Skills
        run: npx tsx tests/skills-calculator.test.ts

      - name: Test Progress Sync
        run: npx tsx tests/progress-sync.test.ts

      - name: Run Security Gate Tests
        run: npx tsx tests/security.test.ts

      - name: Run Scientific Governance & Back-office Tests
        run: npx tsx tests/scientific-governance.test.ts

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js 16 Application
        run: npm run build
